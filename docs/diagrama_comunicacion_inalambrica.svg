<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 740" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Filtro sombra suave para tarjetas tipo Eraser -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    
    <!-- Marcador de flecha derecha -->
    <marker id="arrow-right" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    
    <!-- Marcador de flecha izquierda -->
    <marker id="arrow-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ================= TITULO PRINCIPAL ================= -->
  <text x="60" y="55" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="-0.3">OPTURIZE — ARQUITECTURA DE COMUNICACIÓN INALÁMBRICA IOT</text>
  <text x="60" y="85" font-size="13.5" font-weight="400" fill="#64748b">Topología de red de extremo a extremo: Dispositivo Edge ➔ Enlace Wi-Fi ➔ Gateway Local ➔ Broker MQTT Cloud ➔ Aplicaciones Web</text>

  <!-- ================= CAPA 1: DISPOSITIVO IOT EDGE ================= -->
  <g id="capa-edge" filter="url(#card-shadow)">
    <rect x="60" y="130" width="280" height="400" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    
    <!-- Badge -->
    <rect x="80" y="150" width="96" height="22" rx="6" fill="#2563eb"/>
    <text x="128" y="165" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">CAPA 1: EDGE</text>
    
    <!-- Titulo Tarjeta -->
    <text x="80" y="198" font-size="16" font-weight="700" fill="#1e3a8a">Dispositivo IoT de Borde</text>
    <text x="80" y="218" font-size="12" font-weight="600" fill="#2563eb">ESP32 DevKit V1 (Nodo Principal)</text>
    
    <!-- Seccion Hardware -->
    <line x1="80" y1="230" x2="320" y2="230" stroke="#bfdbfe" stroke-width="1"/>
    <text x="80" y="248" font-size="11.5" font-weight="600" fill="#1e40af">Microcontrolador &amp; RF:</text>
    <text x="80" y="266" font-size="11" fill="#334155">• CPU Dual-Core Xtensa 240 MHz</text>
    <text x="80" y="284" font-size="11" fill="#334155">• Radio Wi-Fi 2.4 GHz 802.11 b/g/n</text>
    <text x="80" y="302" font-size="11" fill="#334155">• Antena PCB integrada (+19.5 dBm)</text>
    
    <!-- Sensores -->
    <text x="80" y="328" font-size="11.5" font-weight="600" fill="#1e40af">Sensores Conectados:</text>
    <text x="80" y="346" font-size="11" fill="#334155">• HC-SR04 Entrada (Pines 5, 18)</text>
    <text x="80" y="364" font-size="11" fill="#334155">• HC-SR04 Salida (Pines 19, 25)</text>
    <text x="80" y="382" font-size="11" fill="#334155">• DHT22 Clima (Pin 4)</text>
    
    <!-- Actuadores -->
    <text x="80" y="408" font-size="11.5" font-weight="600" fill="#1e40af">Actuadores en Sitio:</text>
    <text x="80" y="426" font-size="11" fill="#334155">• Semáforo LED (Pines 12, 14, 27)</text>
    <text x="80" y="444" font-size="11" fill="#334155">• Talanquera Servo SG90 (Pin 13)</text>
    <text x="80" y="462" font-size="11" fill="#334155">• Display OLED SSD1306 (I2C 21/22)</text>
    <text x="80" y="480" font-size="11" fill="#334155">• Buzzer Alarma Sonora (Pin 23)</text>
  </g>

  <!-- ================= CAPA 2: ENLACE INALAMBRICO ================= -->
  <g id="capa-wireless" filter="url(#card-shadow)">
    <rect x="390" y="170" width="250" height="320" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
    
    <!-- Badge -->
    <rect x="410" y="190" width="116" height="22" rx="6" fill="#16a34a"/>
    <text x="468" y="205" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">CAPA 2: WIRELESS</text>
    
    <!-- Titulo Tarjeta -->
    <text x="410" y="238" font-size="16" font-weight="700" fill="#14532d">Enlace Wi-Fi (WLAN)</text>
    <text x="410" y="258" font-size="12" font-weight="600" fill="#16a34a">Estándar IEEE 802.11 b/g/n</text>
    
    <line x1="410" y1="270" x2="620" y2="270" stroke="#bbf7d0" stroke-width="1"/>
    <text x="410" y="292" font-size="11.5" fill="#1f2937"><tspan font-weight="600">Frecuencia:</tspan> 2.4 GHz (Canales 1-11)</text>
    <text x="410" y="316" font-size="11.5" fill="#1f2937"><tspan font-weight="600">Alcance Efectivo:</tspan> 15 – 45 metros</text>
    <text x="410" y="340" font-size="11.5" fill="#1f2937"><tspan font-weight="600">Seguridad:</tspan> WPA2 / WPA3-Personal</text>
    <text x="410" y="364" font-size="11.5" fill="#1f2937"><tspan font-weight="600">Modulación:</tspan> DSSS / OFDM</text>
    <text x="410" y="388" font-size="11.5" fill="#1f2937"><tspan font-weight="600">Tasa de Datos:</tspan> Hasta 72.2 Mbps</text>
    <text x="410" y="412" font-size="11.5" fill="#1f2937"><tspan font-weight="600">Latencia RF:</tspan> &lt; 15 ms en LAN</text>
    <text x="410" y="436" font-size="11.5" fill="#1f2937"><tspan font-weight="600">Topología:</tspan> Modo Infraestructura (BSS)</text>
  </g>

  <!-- ================= CAPA 3: GATEWAY LOCAL / CASETA ================= -->
  <g id="capa-gateway" filter="url(#card-shadow)">
    <rect x="690" y="160" width="260" height="340" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
    
    <!-- Badge -->
    <rect x="710" y="180" width="116" height="22" rx="6" fill="#d97706"/>
    <text x="768" y="195" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">CAPA 3: GATEWAY</text>
    
    <!-- Titulo Tarjeta -->
    <text x="710" y="228" font-size="16" font-weight="700" fill="#78350f">Router / AP Caseta</text>
    <text x="710" y="248" font-size="12" font-weight="600" fill="#d97706">Infraestructura Local del Sitio</text>
    
    <line x1="710" y1="260" x2="930" y2="260" stroke="#fde68a" stroke-width="1"/>
    <text x="710" y="280" font-size="11.5" font-weight="600" fill="#92400e">Servicios de Red Local:</text>
    <text x="710" y="298" font-size="11" fill="#334155">• Servidor DHCP (IPv4 Dinámica)</text>
    <text x="710" y="316" font-size="11" fill="#334155">• Subred LAN: 192.168.1.0/24</text>
    <text x="710" y="334" font-size="11" fill="#334155">• Firewall SPI / NAT</text>
    
    <text x="710" y="364" font-size="11.5" font-weight="600" fill="#92400e">Conectividad Externa (WAN):</text>
    <text x="710" y="382" font-size="11" fill="#334155">• Enlace Primario: Fibra Óptica</text>
    <text x="710" y="400" font-size="11" fill="#334155">• Respaldo: Módem 4G LTE Cat-4</text>
    <text x="710" y="418" font-size="11" fill="#334155">• Salida a Internet Corporativa</text>
  </g>

  <!-- ================= CAPA 4: PLATAFORMA CLOUD ================= -->
  <g id="capa-cloud" filter="url(#card-shadow)">
    <rect x="1000" y="140" width="270" height="380" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.8"/>
    
    <!-- Badge -->
    <rect x="1020" y="160" width="100" height="22" rx="6" fill="#7c3aed"/>
    <text x="1070" y="175" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">CAPA 4: CLOUD</text>
    
    <!-- Titulo Tarjeta -->
    <text x="1020" y="208" font-size="16" font-weight="700" fill="#4c1d95">Plataforma IoT Cloud</text>
    <text x="1020" y="228" font-size="12" font-weight="600" fill="#7c3aed">Broker MQTT &amp; Backend API</text>
    
    <line x1="1020" y1="240" x2="1250" y2="240" stroke="#e9d5ff" stroke-width="1"/>
    <text x="1020" y="260" font-size="11.5" font-weight="600" fill="#6b21a8">Broker MQTT (HiveMQ / AWS):</text>
    <text x="1020" y="278" font-size="11" fill="#334155">• Protocolo: MQTT v3.1.1</text>
    <text x="1020" y="296" font-size="11" fill="#334155">• Puertos: 1883 TCP / 8883 MQTTS</text>
    <text x="1020" y="314" font-size="11" fill="#334155">• Tópico Pub: .../telemetria (QoS 1)</text>
    <text x="1020" y="332" font-size="11" fill="#334155">• Tópico Sub: .../control (QoS 1)</text>
    
    <text x="1020" y="362" font-size="11.5" font-weight="600" fill="#6b21a8">Servicios de Procesamiento:</text>
    <text x="1020" y="380" font-size="11" fill="#334155">• Ingestion Engine (Node.js REST/WS)</text>
    <text x="1020" y="398" font-size="11" fill="#334155">• BD Series de Tiempo (Aforos)</text>
    <text x="1020" y="416" font-size="11" fill="#334155">• Reglas de Alerta Temprana</text>
    <text x="1020" y="434" font-size="11" fill="#334155">• Motor de Predicción de Saturación</text>
  </g>

  <!-- ================= CAPA 5: APLICACIONES ================= -->
  <g id="capa-apps" filter="url(#card-shadow)">
    <rect x="1320" y="160" width="250" height="340" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.8"/>
    
    <!-- Badge -->
    <rect x="1340" y="180" width="130" height="22" rx="6" fill="#0891b2"/>
    <text x="1405" y="195" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">CAPA 5: APLICACIONES</text>
    
    <!-- Titulo Tarjeta -->
    <text x="1340" y="228" font-size="16" font-weight="700" fill="#164e63">TanStack Web App</text>
    <text x="1340" y="248" font-size="12" font-weight="600" fill="#0891b2">Visualización &amp; Persuasión</text>
    
    <line x1="1340" y1="260" x2="1550" y2="260" stroke="#cffafe" stroke-width="1"/>
    <text x="1340" y="280" font-size="11.5" font-weight="600" fill="#155e75">Dashboard Administrativo:</text>
    <text x="1340" y="298" font-size="11" fill="#334155">• Ocupación de aforo en vivo</text>
    <text x="1340" y="316" font-size="11" fill="#334155">• Control manual de talanquera</text>
    <text x="1340" y="334" font-size="11" fill="#334155">• Estado de salud de sensores (RSSI)</text>
    
    <text x="1340" y="364" font-size="11.5" font-weight="600" fill="#155e75">Portal Web del Turista:</text>
    <text x="1340" y="382" font-size="11" fill="#334155">• Semáforo de capacidad en tiempo real</text>
    <text x="1340" y="400" font-size="11" fill="#334155">• Desvío persuasivo (Modelo Fogg)</text>
    <text x="1340" y="418" font-size="11" fill="#334155">• Recomendación de sitios alternos</text>
  </g>

  <!-- ================= LINEAS DE CONEXION UPLINK (SOLIDA) ================= -->
  <!-- Edge -> Wireless -->
  <line x1="340" y1="310" x2="388" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#arrow-right)"/>
  <rect x="345" y="288" width="38" height="16" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="364" y="300" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">RF</text>

  <!-- Wireless -> Gateway -->
  <line x1="640" y1="310" x2="688" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#arrow-right)"/>
  <rect x="643" y="288" width="42" height="16" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="664" y="300" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">WPA2</text>

  <!-- Gateway -> Cloud -->
  <line x1="950" y1="310" x2="998" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#arrow-right)"/>
  <rect x="955" y="288" width="40" height="16" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="975" y="300" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">WAN</text>

  <!-- Cloud -> Apps -->
  <line x1="1270" y1="310" x2="1318" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#arrow-right)"/>
  <rect x="1273" y="288" width="44" height="16" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="1295" y="300" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">REST/WS</text>

  <!-- ================= LINEAS DE CONEXION DOWNLINK (DISCONTINUA) ================= -->
  <!-- Apps -> Cloud (Comando) -->
  <line x1="1318" y1="380" x2="1272" y2="380" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-left)"/>
  
  <!-- Cloud -> Gateway (Comando Downlink) -->
  <line x1="998" y1="380" x2="952" y2="380" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-left)"/>
  
  <!-- Gateway -> Wireless (Reenvío) -->
  <line x1="688" y1="380" x2="642" y2="380" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-left)"/>
  
  <!-- Wireless -> Edge (Actuación) -->
  <line x1="388" y1="380" x2="342" y2="380" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-left)"/>
  <rect x="345" y="388" width="130" height="16" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="410" y="400" font-size="8.5" font-weight="600" fill="#64748b" text-anchor="middle">Downlink / Control Remoto</text>

  <!-- ================= BANNER INFERIOR DE PROTOCOLOS ================= -->
  <g id="banner-protocolos" filter="url(#card-shadow)">
    <rect x="60" y="570" width="1510" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
    
    <rect x="80" y="585" width="130" height="20" rx="5" fill="#475569"/>
    <text x="145" y="599" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">RESUMEN DE PROTOCOLOS</text>
    
    <text x="80" y="625" font-size="12" fill="#1e293b"><tspan font-weight="700">Pila de Comunicaciones:</tspan> Capa de Enlace: IEEE 802.11 b/g/n (Wi-Fi 2.4 GHz)  |  Capa de Red: IPv4 / DHCP  |  Capa de Transporte: TCP (Puertos 1883 / 8883 MQTTS)</text>
    <text x="80" y="650" font-size="11.5" fill="#334155"><tspan font-weight="700">Capa de Aplicación (MQTT):</tspan> Publicación de Telemetría cada 30 segundos en <tspan font-family="monospace" fill="#0369a1">opturize/turismo/ESP32-TURISMO-01/telemetria</tspan> (QoS 1)</text>
    <text x="80" y="675" font-size="11.5" fill="#334155"><tspan font-weight="700">Eventos Críticos (Asíncronos):</tspan> Alerta inmediata ante sobreaforo en <tspan font-family="monospace" fill="#b91c1c">opturize/turismo/ESP32-TURISMO-01/alertas</tspan> para activar desvío conductual (Fogg)</text>
  </g>
</svg>
